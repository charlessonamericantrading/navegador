# Puerta de calidad de la aplicacion: interfaz React y envoltorio Electron.
#
# El motor tiene su propia puerta (`engine.yml`). Esta cubre lo que vive fuera
# de Rust: que la interfaz compila con tipos correctos, que el bundle de
# produccion se genera, y que `electron-builder` sigue sabiendo empaquetar.
#
# Sobre ESLint: hoy NO bloquea, y no por dejadez. La interfaz declara
# TypeScript 7 (el port nativo, mucho mas rapido), pero `typescript-eslint`
# —incluida su ultima version, 8.70— solo soporta TypeScript `<6.1.0`. Con TS 7
# el parser revienta antes de analizar un solo fichero
# (`TypeError: Cannot read properties of undefined (reading 'Cjs')`). No es un
# fallo del codigo de este repo ni algo que se arregle escribiendo mejor
# TypeScript: es que la pieza compatible todavia no existe. Las alternativas
# son bajar TypeScript a 5.x (perdiendo el compilador rapido) o esperar a que
# `typescript-eslint` soporte TS 7; mientras tanto, `tsc` SI comprueba los
# tipos de verdad y eso si bloquea, que es la mitad que de verdad atrapa
# errores.
name: app

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # `tsc -b` es la comprobacion que de verdad atrapa errores; va aparte
      # del build para que el log diga si fallo el tipado o el empaquetado.
      - name: Comprobar tipos
        working-directory: frontend
        run: npx tsc -b

      - name: Compilar
        working-directory: frontend
        run: npm run build

      # Informativo mientras dure la incompatibilidad TS 7 / typescript-eslint
      # descrita en la cabecera de este fichero.
      - name: Lint (informativo)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias de la interfaz
        working-directory: frontend
        run: npm ci

      # `electron-builder` copia `frontend/dist` como recurso extra, asi que
      # sin este build el empaquetado fallaria por una razon que no tiene nada
      # que ver con Electron.
      - name: Compilar la interfaz
        working-directory: frontend
        run: npm run build

      - name: Instalar dependencias de Electron
        working-directory: desktop
        run: npm ci

      # `--dir` empaqueta sin generar el instalador NSIS: comprueba que la
      # configuracion de `electron-builder` es valida y que los recursos que
      # declara existen, sin gastar los minutos de construir el .exe ni
      # necesitar certificado de firma.
      #
      # `-c.extraResources=null` desactiva los recursos extra a proposito: el
      # motor compilado y el backend viven en `desktop/build-resources/`, que
      # esta en .gitignore porque son binarios de 50 MB. En CI no existen, y
      # empaquetar sin ellos sigue validando lo que aqui interesa, que es la
      # configuracion.
      - name: Empaquetar (sin instalador)
        working-directory: desktop
        run: npx electron-builder --dir -c.extraResources=null
