<!doctype html><html><head><meta charset="utf-8"><title>PENDIENTE</title>
<script>
function ok(cond, motivo) { document.title = cond ? 'OK' : 'FALLO: ' + motivo; }
function fallo(e) { document.title = 'FALLO: ' + (e && e.message ? e.message : String(e)); }
</script></head><body>
<p id="salida"></p>
<script type="module">
import { saludar } from './modulo-a.js';
try {
  document.getElementById('salida').textContent = saludar('corpus');
  ok(document.getElementById('salida').textContent === 'hola, corpus!', 'texto=' + document.getElementById('salida').textContent);
} catch (e) { fallo(e); }
</script>
</body></html>
