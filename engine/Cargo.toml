[workspace]
resolver = "2"
members = [
    "crates/net",
    "crates/dom",
    "crates/css",
    "crates/layout",
    "crates/gfx",
    "crates/image",
    "crates/text",
    "crates/js",
    "crates/core",
    "crates/ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Navegador IA Engine Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
url = "2.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1.0"
brotli = "6.0"
# Directorio de datos por SO real (`%APPDATA%`/`~/Library/Application
# Support`/XDG) para `localStorage` en disco (ver `net/src/storage.rs`) -
# las tres convenciones tienen suficientes bordes (roaming vs local en
# Windows, XDG_DATA_HOME con fallback en Linux) como para no reinventarlas
# a mano, mismo criterio que TLS/parseo HTML: no evitar TODA dependencia,
# evitar reimplementar cosas con superficie de error real.
dirs = "5"
