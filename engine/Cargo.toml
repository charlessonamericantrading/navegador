[workspace]
resolver = "2"
members = [
    "crates/net",
    "crates/dom",
    "crates/css",
    "crates/layout",
    "crates/gfx",
    "crates/image",
    "crates/text",
    "crates/js",
    "crates/core",
    "crates/ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Navegador IA Engine Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
# Concurrencia acotada para descargar subrecursos en paralelo (Fase 39).
# Ya venia en el arbol de dependencias a traves de hyper: declararlo
# explicitamente no anade codigo nuevo al binario, solo lo hace visible.
# Escribir a mano un limitador de concurrencia correcto (orden preservado,
# cancelacion, backpressure) es justo lo que la doctrina de dependencias
# dice que no hay que reimplementar.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", features = ["ring"] }
url = "2.5"
thiserror = "1.0"
tracing = "0.1"
# `env-filter` no viene por defecto y es lo que hace que `RUST_LOG` mande;
# sin ella el motor solo puede elegir un nivel fijo en tiempo de compilacion.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1.0"
brotli = "6.0"
# Directorio de datos por SO real (`%APPDATA%`/`~/Library/Application
# Support`/XDG) para `localStorage` en disco (ver `net/src/storage.rs`) -
# las tres convenciones tienen suficientes bordes (roaming vs local en
# Windows, XDG_DATA_HOME con fallback en Linux) como para no reinventarlas
# a mano, mismo criterio que TLS/parseo HTML: no evitar TODA dependencia,
# evitar reimplementar cosas con superficie de error real.
dirs = "5"
# Lista de sufijos publicos de Mozilla (`net/src/cookie.rs`) - rechaza un
# `Set-Cookie: Domain=` que sea un TLD/sufijo publico entero (`.co.uk`,
# `.com`), que un navegador real bloquea para impedir que un sitio ponga
# una cookie valida para TODOS los dominios de ese sufijo. Tabla de datos
# generada y embebida (sin red, `#![no_std]`), no una reimplementacion a
# mano: la lista cambia con el tiempo y tiene miles de entradas, exactamente
# la clase de dato que la doctrina de dependencias dice que no vale la pena
# mantener a mano.
psl = "2.1.226"
