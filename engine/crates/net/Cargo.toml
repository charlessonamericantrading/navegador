[package]
name = "engine-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
rustls.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-roots", "tls12", "ring"] }
http-body-util = "0.1"
flate2.workspace = true
brotli.workspace = true
# Persistencia a disco de `localStorage` (ver storage.rs) - el mismo
# serde/serde_json que ya usa `engine-core` para el protocolo NDJSON, no
# entra ningun crate nuevo en el arbol de dependencias.
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
