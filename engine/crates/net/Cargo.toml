[package]
name = "engine-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
rustls.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-roots", "tls12", "ring"] }
http-body-util = "0.1"
flate2.workspace = true
brotli.workspace = true
# Persistencia a disco de `localStorage` (ver storage.rs) - el mismo
# serde/serde_json que ya usa `engine-core` para el protocolo NDJSON, no
# entra ningun crate nuevo en el arbol de dependencias.
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
# Decodificacion de texto segun el charset (tarea 1.6 del plan): ISO-8859-1,
# Windows-1252, Shift_JIS, GBK, KOI8-R... Es una biblioteca madura y muy probada;
# cada codificacion heredada tiene sus propios casos borde y no se reimplementa.
encoding_rs = "0.8"
psl.workspace = true
# Tokens del canal del broker (ADR 0001, etapa 2): aleatoriedad del sistema.
# La misma version que ya compila `ring` (rustls), no entra codigo nuevo.
getrandom = "0.2"

[lints]
workspace = true
